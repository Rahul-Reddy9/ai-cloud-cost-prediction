# Reactive baseline for the live comparison: a properly configured HPA (not the simulator approximation).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sample-web-app
  namespace: autoscale-test
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: sample-web-app}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
