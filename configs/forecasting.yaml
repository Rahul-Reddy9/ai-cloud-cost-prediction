# Part B: TFT forecasting
target: request_rate
encoder_length: 48          # 4 h of history at 5-min steps
horizon: 12                 # 12 steps = next hour (design choice, see docs/methodology.md)
quantiles: [0.1, 0.5, 0.9]
# Covariates must exist under ANY controller policy: only workload + calendar features are used.
# (cpu/latency/memory depend on the logged replica count, so they are excluded from TFT.)
known_reals: [hour_sin, hour_cos, dow_sin, dow_cos]
unknown_reals: [request_rate, request_rate_roll]
model:
  hidden_size: 16
  attention_head_size: 2
  dropout: 0.1
  hidden_continuous_size: 8
  learning_rate: 0.003
  reduce_on_plateau_patience: 2
training:
  batch_size: 256
  max_epochs: 6
  early_stopping_patience: 3
  gradient_clip_val: 0.1
  limit_train_batches: 1.0
  num_workers: 0
  accelerator: cpu
  seed: 42
baselines:
  moving_average_window: 12
  seasonal_period_steps: 288   # same time yesterday
paths:
  model_dir: models/forecasting
  predictions_file: data/processed/forecast_predictions.parquet
