# Part E: PPO controller
algorithm:
  learning_rate: 0.0003
  learning_rate_final: 0.00003      # linear decay
  target_kl: 0.03
  n_steps: 2048
  batch_size: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
training:
  total_timesteps: 150000
  eval_every_steps: 8192
  train_split: validation            # TFT forecasts on this split are out-of-sample
  train_fraction: 0.7                # first 70% of validation: PPO training episodes
                                     # last 30%: checkpoint selection (never the test split)
  device: cpu
# Feature switches for the ablations (state s_t = [u,m,d_hat,q,p,c,z] + time features)
variants:
  ppo_base:      {use_uncertainty: false, use_pending: false, anomaly: none}
  ppo_point:     {use_uncertainty: false, use_pending: true,  anomaly: none}
  ppo_unc:       {use_uncertainty: true,  use_pending: false, anomaly: none}
  ppo_full:      {use_uncertainty: true,  use_pending: true,  anomaly: none}
  ppo_full_rawz: {use_uncertainty: true,  use_pending: true,  anomaly: raw}
  ppo_full_residz: {use_uncertainty: true, use_pending: true, anomaly: residual}
paths:
  model_dir: models/controller
