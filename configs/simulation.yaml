# Part D: resource simulator, cost model, safety (all values are documented ASSUMPTIONS)
cluster:
  min_replicas: 2
  max_replicas: 24
  initial_replicas: 6
  cpu_cores_per_replica: 2.0
  cpu_seconds_per_request: 0.02      # -> CPU-bound capacity 2.0/0.02 = 100 req/s per replica
  memory_gb_per_replica: 4.0
  memory_usable_fraction: 0.9
  memory_base_gb: 0.8
  memory_gb_per_rps: 0.02            # -> memory-bound capacity (4*0.9-0.8)/0.02 = 140 req/s
provisioning:
  delay_steps: 3                     # 15 min between request and usable capacity
  jitter_steps: 0
  max_delay_steps: 6
  bill_pending: true
price:
  currency: USD
  price_per_replica_hour: 0.05
  interval_minutes: 5
latency:                             # SYNTHETIC approximation, not a measurement
  base_ms: 40.0
  rho_cap: 0.95
  overload_slope: 5.0
  timeout_ms: 5000.0
slo:
  latency_ms: 300.0                  # violated when modelled latency > 300 ms OR requests are dropped
noise:
  metric_noise: 0.01
reward:                              # r = -(alpha*C + beta*L + gamma*V + delta*H)
  alpha: 1.0
  beta: 0.2
  gamma: 1.5
  delta: 0.05
  latency_cap_ratio: 3.0
actions:
  deltas: [-1, 0, 1, 3]              # decrease by one / keep / increase by one / larger bounded increase
safety:
  enabled: true
  scale_down_max_util: 0.85          # never scale down if observed demand would exceed this utilisation
  emergency_scale_up: false          # optional conventional fallback
  emergency_util: 1.0
  invalid_action: noop
episode:
  length_steps: 288
  initial_util: 0.65
  forecast_steps: [1, 3, 6, 12]
